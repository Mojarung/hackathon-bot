[project]
name = "hackbot"
version = "0.1.0"
description = "Telegram bot that runs hackathon timelines in forum topics"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiogram>=3.30,<4",
    "pydantic-ai-slim[openai]>=2.33",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22",
    "fastapi>=0.118",
    "uvicorn>=0.36",
    "jinja2>=3.1",
    "icalendar>=6.1",
    "tzdata",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
]

[project.scripts]
hackbot = "hackbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbot"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Prompt text, not code: wrapping it would only make it harder to read.
"src/hackbot/agent/defaults.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
